[project]
name = 'langchain-first-chain'
version = '0.1.0'
description = 'Hands-on starter for LangChain LCEL with local Ollama'
requires-python = '>=3.10'
dependencies = [
  'langchain>=1.0.0',
  'langchain-ollama>=0.3.0',
  'langchain-core>=0.3.0',
  'pydantic>=2',
  'langgraph>=1.0.0',
  'langgraph-checkpoint-sqlite>=2.0.0',
]

[dependency-groups]
dev = [
  'langgraph-cli[inmem]',
  # Windows: langgraph-api ConsoleRenderer needs colorama
  'colorama',
  'pre-commit',
  'pytest>=8.0.0',
]

[tool.pytest.ini_options]
testpaths = ['tests']
pythonpath = ['.']

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

# Flat layout: ship root modules so langgraph.json dependencies ["."] can install.
[tool.hatch.build.targets.wheel]
only-include = [
  'settings.py',
  'chatbot.py',
  'first_chain.py',
  'extract_paragraph.py',
  'graph_core.py',
  'graph_server.py',
  'graph_chatbot.py',
  'compare_create_agent.py',
]
